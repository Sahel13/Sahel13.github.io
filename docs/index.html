<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Website moved</title>
    <style>
      :root {
        color-scheme: light;
        --page-background: #fffff8;
        --text-color: #111111;
        --link-color: #6a0dad;
        --link-hover-background: #e6e6fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        max-width: 70rem;
        margin: 0 auto;
        padding: 3rem;
        background: var(--page-background);
        color: var(--text-color);
        font: 2.2rem/1.4 Georgia, serif;
        text-align: center;
      }

      p {
        margin: 0;
      }

      a {
        color: var(--link-color);
        text-decoration: none;
        border-radius: 0.2rem;
      }

      a:hover,
      a:focus-visible {
        background: var(--link-hover-background);
      }
    </style>
  </head>
  <body>
    <p>The website has moved to <a href="https://saheliqbal.com/">https://saheliqbal.com/</a>.</p>
  </body>
</html>
